<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kado Ulang Tahun</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      transition: background 2s ease, opacity 1s ease;
    }

    /* Tampilan awal (Ucapan) */
    #birthdaySection {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #fff;
    }

    /* 🔥 Judul di atas tombol */
    #birthdaySection h1 {
      font-size: 1.4rem;
      font-weight: bold;
      color: #b30059; /* warna magenta tua */
      margin-bottom: 25px;
      animation: fadeIn 2s ease-in-out;
      text-shadow: 2px 2px 6px rgba(255, 255, 255, 0.7);
    }

    #button {
      font-size: 1.0rem;
      padding: 12px 30px;
    }

    #iloveyou {
      display: none;
      animation: fadeIn 2s ease-in-out;
    }

    #hati {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 1.2rem;
      color: #3b0404;
      cursor: pointer;
      display: none;
      animation: pulse 2s infinite;
    }

    /* Tampilan kedua (Kado) */
    #giftSection {
      display: none;
      text-align: center;
      color: #660066;
      opacity: 0;
      transition: opacity 2s ease;
    }

    .gift {
      cursor: pointer;
      text-align: center;
      font-size: 100px;
      animation: bounce 1s infinite;
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.7));
      transition: transform 0.3s, filter 0.3s;
    }

    .gift:hover {
      transform: scale(1.1) rotate(-5deg);
      filter: drop-shadow(0 0 25px rgba(255, 255, 255, 1));
    }

    .text {
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
      animation: pulse 2s infinite;
    }

    /* Animasi */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .confetti {
      position: absolute;
      top: -50px;
      font-size: 24px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <!-- Bagian Ucapan -->
  <div id="birthdaySection">
    <h1>🎉 Happy Birthday 🎂</h1>
    <button id="button" class="btn btn-primary btn-lg" onclick="mulai();music1()">
      Click Here!
    </button>

    <div id="iloveyou">
      <h2 id="birthdayMessage" class="text-center">
        Happy Birthday <span id="birthdayName"></span>
      </h2>
      <h2 class="text-center">&#x1F389;</h2>
    </div>
  </div>

  <span id="hati" onclick="showGift()">💖 Click Here 💖</span>

  <!-- Bagian Kado -->
  <div id="giftSection">
    <h1>🎂 생일 축하합니다, 노바! 🎂</h1>
    <div class="gift" onclick="openGift()">🎁</div>
    <div class="text">Klik kadonya yaa 🎉</div>
  </div>

  <!-- Audio -->
  <audio id="bgMusic1" src="seventeen.mp3" loop></audio>
  <audio id="bgMusic2" src="music/buka_kado.mp3" loop></audio>

  <!-- Script -->
  <script>
    const swals = Swal.mixin({
      cancelButtonColor: "#d33",
      confirmButtonColor: "#3085d6",
    });

    let audio1 = document.getElementById("bgMusic1");
    let audio2 = document.getElementById("bgMusic2");
    let playing1 = false;

    function music1() {
      if (!playing1) audio1.play();
      playing1 = true;
    }

    function stopMusic1() {
      audio1.pause();
      audio1.currentTime = 0;
      playing1 = false;
    }

    async function mulai() {
      await swals.fire("Halo!", "Karena ini hari yang spesial buat kamu ❤️", "question");
      await swals.fire("Aku mau ngucapin sesuatu nih ke kamu 😊");

      // var { value: nama } = await swals.fire({
      //   title: "Tulis nama kamu dulu ya",
      //   input: "text",
      // });
      nama = "Nova"

      if (!nama) return stopMusic1();

      document.getElementById("birthdayName").textContent = nama;
      var { isConfirmed: sayang } = await swals.fire({
        title: `${nama}, hari ini ulang tahun ya? 🥰`,
        confirmButtonText: "Iya",
        cancelButtonText: "Tidak",
        showCancelButton: true,
      });

      if (!sayang) return stopMusic1();

      await swals.fire("Ciee... ada yang nambah tua aja nih 😜😆😄");

      var { value: umur } = await swals.fire({
        title: "Kamu ulang tahun yang ke berapa?",
        icon: "question",
        input: "range",
        inputAttributes: { min: 1, max: 63 },
        inputValue: 10,
      });

      await swals.fire(`Selamat ya 🎉 Di umur ${umur} semoga hari-harimu penuh kebahagiaan 🌸`);
      await swals.fire("Kamu tambah tua, tapi tetep aja cantik😍 & manis kayak gulali 🍭💕");
      await swals.fire("Semoga semua harapanmu tahun ini bisa terwujud 💫");
      await swals.fire("Dan semoga kamu selalu sehat, sukses, dan dikelilingi hal - hal baik ❤️");
      await swals.fire("Sekarang, coba klik ikon hati di bawah ini ya 💖");

      document.getElementById("button").style.display = "none";
      document.getElementById("iloveyou").style.display = "";
      document.getElementById("hati").style.display = "block";
    }

    // Confetti awal
    const emojis = ["🎉", "✨", "💖", "🎀", "🎂"];
    setInterval(() => {
      const confetti = document.createElement("div");
      confetti.className = "confetti";
      confetti.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      confetti.style.left = Math.random() * 100 + "vw";
      confetti.style.animationDuration = 3 + Math.random() * 3 + "s";
      document.body.appendChild(confetti);
      setTimeout(() => confetti.remove(), 6000);
    }, 500);

    // Ganti ke tampilan kado
    function showGift() {
      stopMusic1();
      audio2.play();
      document.getElementById("birthdaySection").style.opacity = "0";
      document.getElementById("hati").style.display = "none";

      setTimeout(() => {
        document.getElementById("birthdaySection").style.display = "none";
        document.getElementById("giftSection").style.display = "block";
        setTimeout(() => {
          document.getElementById("giftSection").style.opacity = "1";
        }, 100);
      }, 1000);
    }

    function openGift() {
      Swal.fire({
        title: "🎁 Selamat! 🎁",
        text: "Sekarang bukalah buku ucapannya 💌",
        icon: "success",
        confirmButtonText: "Lihat Buku Ucapan",
      }).then(() => {
        window.location.href = "buku-ucapan.html";
      });
    }
  </script>
</body>
</html>
